<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Talmage Winters">
    <link rel="stylesheet" href="../Styles/style.css">
    <title>TypeScript Note Program</title>
</head>
<body id="contentContainer">
    <header>
        <h1>Notes App</h1>
    </header>
    <main id="noteEditorAndList">
        <div id="noteList">Notes you make will appear here</div>
        <p id="noNotesDefault">Looks like you don't have any notes. Press the '+' button to create your first note!</p>
    </main>
    <footer>
        <button id="newNoteBtn">+</button>
    </footer>
</body>
</html>
